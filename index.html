<title>容形｜符號合成</title>
<style>:root{color-scheme:light;--ink:#141411;--paper:#f8f7f2;--accent:#dbfc49;font-family:Inter,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#171715}
*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100dvh}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--ink);background:var(--paper);padding:.6em 1em}button:hover,button:focus-visible{background:var(--accent)}[hidden]{display:none!important}
#app{width:min(100vw,56.25dvh);height:100dvh;display:grid;grid-template-rows:12% 1fr 14%;position:relative;background:var(--paper);container-type:inline-size;font-size:clamp(11px,3.5cqw,24px)}
@media(max-aspect-ratio:9/16){#app{height:177.78vw}}
header{margin:0 5%;display:flex;align-items:center;justify-content:space-between;font-size:3cqw;line-height:1.35;letter-spacing:.1em;text-align:right}header img{width:25%;display:block}
#stage{position:relative;overflow:hidden;isolation:isolate;margin:0 5%;border:1px solid var(--ink);background:#e9e8df}
video,.grid,#targets{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;transform:scaleX(-1);opacity:0}#stage.live video{opacity:1}.grid{pointer-events:none;background:radial-gradient(circle,#aaa99d 0.8px,transparent 1px) 0 0/16px 16px,radial-gradient(ellipse,#faf9f3 0%,transparent 67%)}.live .grid{display:none}
.target{position:absolute;width:21%;aspect-ratio:1;display:grid;place-items:center;padding:0;border:1px solid #15151255;border-radius:50%;background:#f8f7f2eb;transform:translate(-50%,-50%);animation:float 5.6s ease-in-out infinite;animation-delay:var(--delay)}
.target img{width:52%;height:52%;object-fit:contain;pointer-events:none}.target.active{background:var(--accent);border-color:#181810;outline:2px solid var(--accent);outline-offset:4px;animation-play-state:paused}
@keyframes float{0%,100%{translate:-3cqw -6cqw}25%{translate:3cqw -1cqw}50%{translate:1cqw 6cqw}75%{translate:-2cqw 2cqw}}
@media(prefers-reduced-motion:reduce){.target{animation:none!important}}
.center{position:absolute;top:50%;left:50%;translate:-50% -50%;display:grid;justify-items:center;gap:.65em;width:56%;text-align:center}.center h1{font-size:8.5cqw;margin:0 0 .18em;font-weight:900;letter-spacing:.07em;white-space:nowrap}.center #start{background:var(--ink);color:white}.center #start:hover{background:var(--accent);color:var(--ink)}.center .subtle{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;padding:.4em}
.cursor{position:absolute;pointer-events:none;width:4%;aspect-ratio:1;border-radius:100%;translate:-50% -50%;background:var(--accent);border:2px solid var(--ink);box-shadow:0 0 0 2px white}
footer{margin:0 5%;display:grid;grid-template-rows:minmax(0,1fr) 3px minmax(0,1fr);align-items:center}#status{font-size:3.2cqw}progress{width:100%;height:3px;border:0;appearance:none;background:#d4d2c7}progress::-webkit-progress-bar{background:#d4d2c7}progress::-webkit-progress-value{background:#606f08}progress::-moz-progress-bar{background:#606f08}.tools{display:flex;justify-content:flex-end;gap:.5em}.tools button,.tools select{font-size:2.8cqw;padding:.3em .55em}.tools select{max-width:62%;background:var(--paper)}
dialog{width: min(82cqw,78vw);max-height:95dvh;border:0;background:none;padding:0;overflow:auto;color:inherit}dialog::backdrop{background:#141411d9}dialog form{text-align:center;margin-top:.6em}.card{background:var(--paper);text-align:center;border:1px solid var(--ink);padding:6%;aspect-ratio:4/5;display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center}.brand{width:25%;justify-self:start}.card p{margin:1.4em 0 .1em}.card h2{font-size:8cqw;margin:0 0 .1em}#fusion{position:relative;width:82%;align-self:center;aspect-ratio:1}#fusion img{position:absolute;width:61%;height:61%;object-fit:contain}#fusion img:first-child{top:11%;left:8%;--x:-45%;--y:-40%}#fusion img:last-child{top:33%;left:34%;--x:45%;--y:40%}dialog[open] #fusion img{animation:merge .65s cubic-bezier(.16,1,.3,1) both}@keyframes merge{from{transform:translate(var(--x),var(--y)) scale(.7);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
#app{font-size:clamp(12px,2.1dvh,24px)}

#app[data-mode="intro"] header{visibility:hidden}#app[data-mode="intro"] #status:not([data-feedback]),#app[data-mode="intro"] progress{visibility:hidden}
.center svg,.tools svg{display:block;width:1.35em;height:1.35em}.center{gap:.45em}.center #demo{background:transparent;border-color:transparent}.center #demo:hover{background:var(--accent)}
#artwork{width:100%;height:auto;max-height:65dvh;object-fit:contain;display:block}
.card-actions{text-align:center;background:var(--paper);padding:.45em;margin-top:.4em}
.card-actions p{font-size:.8em;margin:.25em 0}
#qr{width:clamp(85px,13dvh,140px);height:auto;padding:8px;background:white;display:block;margin:auto;image-rendering:pixelated}
#download{color:inherit;text-underline-offset:4px;font-size:.85em}
body[data-shared] #app{width:min(100vw,540px)}
body[data-shared] #app > :not(dialog){visibility:hidden}
body[data-shared] dialog{width:min(92vw,500px)}
body[data-shared] dialog form{display:none}
</style>

const get = id => document.getElementById(id);
const [app, stage, video, intro, status, progress, camera, result, back, start] =
  ['app','stage','video','intro','status','progress','camera','result','back','start'].map(get);
const symbols = [
  ['earth','地',50,13], ['sky','天',81,24], ['mountain','山',83,48],
  ['lake','澤',80,73], ['thunder','雷',50,85], ['fire','火',20,73],
  ['wind','風',17,48], ['water','水',19,24],
];
const cursors = [...stage.querySelectorAll('.cursor')];
const targets = symbols.map(([key, name, x, y], index) => {
  const button = document.createElement('button');
  button.className = 'target';
  button.style.cssText = `left:${x}%;top:${y}%;--delay:-${index * .57}s`;
  button.setAttribute('aria-label', name);
  button.innerHTML = `<img src="${assets[key]}" alt="">`;
  button.disabled = true;
  button.onclick = () => {
    if (mode !== 'demo' || result.open) return;
    choices = choices.includes(index) ? choices.filter(item => item !== index) :
      [...choices.slice(-1), index];
  };
  get('targets').append(button);
  return button;
});

let mode = 'intro', choices = [], detector, stream, request = 0;
let held = '', onset = 0, lastFrame = -1, handTargets = [];
const guide = '雙手各對準一個符號，同時停留 2 秒。';
const demoGuide = '點選兩個不同的符號，等待 2 秒。';

function setMode(next, message) {
  mode = next;
  app.dataset.mode = mode;
  status.toggleAttribute('data-feedback', mode === 'intro' && message !== guide);
  choices = [];
  handTargets = [];
  held = '';
  progress.value = 0;
  intro.hidden = mode !== 'intro';
  back.hidden = mode === 'intro';
  camera.hidden = mode !== 'live' || camera.options.length < 2;
  stage.classList.toggle('live', mode === 'live');
  targets.forEach(button => {
    button.disabled = mode !== 'demo';
    button.classList.remove('active');
  });
  cursors.forEach(cursor => cursor.hidden = true);
  status.textContent = message;
}

function releaseCamera() {
  stream?.getTracks().forEach(track => track.stop());
  stream = undefined;
  video.srcObject = null;
  lastFrame = -1;
}

async function openCamera(deviceId) {
  const attempt = ++request;
  start.disabled = true;
  releaseCamera();
  setMode('intro', '正在開啟鏡頭與載入手勢辨識…');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('unavailable');
    const selectedStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        width: { ideal: 1280 }, height: { ideal: 720 },
        ...(deviceId ? { deviceId: { exact: deviceId } } : {})
      }
    });
    if (attempt !== request) {
      selectedStream.getTracks().forEach(track => track.stop());
      return;
    }
    stream = selectedStream;
    video.srcObject = stream;
    await video.play();
    if (!detector) {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
      const { FilesetResolver, HandLandmarker } = await import(base + '/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks(base + '/wasm');
      detector = await HandLandmarker.createFromOptions(files, {
        baseOptions: {modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
        runningMode: 'VIDEO', numHands: 2
      });
    }
    if (attempt !== request) return;
    const devices = (await navigator.mediaDevices.enumerateDevices())
      .filter(device => device.kind === 'videoinput');
    if (attempt !== request) return;
    camera.replaceChildren(...devices.map((device, index) =>
      new Option(device.label || `鏡頭 ${index + 1}`, device.deviceId)));
    camera.value = stream.getVideoTracks()[0].getSettings().deviceId;
    setMode('live', guide);
    stream.getVideoTracks()[0].addEventListener('ended', () => {
      if (attempt !== request) return;
      releaseCamera();
      setMode('intro', '鏡頭已中斷。重新接上鏡頭後再開啟。');
    });
  } catch (error) {
    if (attempt !== request) return;
    releaseCamera();
    setMode('intro', error.name === 'NotAllowedError' ?
      '請允許瀏覽器使用鏡頭，或選擇滑鼠示範。' :
      '無法啟動鏡頭或手勢辨識。請檢查鏡頭與網路連線。');
  } finally {
    if (attempt === request) start.disabled = false;
  }
}

function trackHands(now) {
  if (!video.videoWidth || video.readyState < 2 || video.currentTime === lastFrame) return;
  lastFrame = video.currentTime;
  const {landmarks} = detector.detectForVideo(video, now);
  const box = stage.getBoundingClientRect();
  const width = stage.clientWidth, height = stage.clientHeight;
  const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
  const visionWidth = scale * video.videoWidth, visionHeight = scale * video.videoHeight;
  const regions = targets.map(target => target.getBoundingClientRect());
  handTargets = cursors.flatMap((cursor, index) => {
    const point = landmarks[index]?.[9];
    cursor.hidden = !point;
    if (!point) return [];
    const x = (1 - point.x) * visionWidth + (width - visionWidth) / 2;
    const y = point.y * visionHeight + (height - visionHeight) / 2;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
    const hit = regions.findIndex(rect =>
      Math.hypot(x + box.left + stage.clientLeft - rect.left - rect.width / 2,
        y + box.top + stage.clientTop - rect.top - rect.height / 2) <= rect.width / 2);
    return hit < 0 ? [] : [hit];
  });
}

const getAsset = key => assets[key];
const cardCanvas = get('artwork');
const download = get('download');
const qrImage = get('qr');
let displayedCard = 0;

async function showCard(selection, shared = false) {
  const revision = ++displayedCard;
  const [first, second] = selection.map(index => symbols[index]);
  const pair = first[1] + ' ＋ ' + second[1];
  const title = first[0] === 'sky' && second[0] === 'wind' ? '龍捲風' : pair;
  const code = selection.join('');
  const canvas = cardCanvas;
  const ctx = canvas.getContext('2d');
  download.hidden = true;
  qrImage.hidden = true;
  canvas.hidden = true;
  get('card-status').textContent = '正在生成作品卡…';
  if (!result.open) result.showModal();
  try {
    const images = await Promise.all(['logo',first[0],second[0]].map(async key => {
      const image = new Image();
      image.src = getAsset(key);
      await image.decode();
      return image;
    }));
    if (revision !== displayedCard || !result.open) return;
    const drawFit = (image,x,y,width,height) => {
      const scale = Math.min(width/image.width,height/image.height);
      const w = image.width*scale, h = image.height*scale;
      ctx.drawImage(image,x+(width-w)/2,y+(height-h)/2,w,h);
    };
    ctx.fillStyle = '#f8f7f2';
    ctx.fillRect(0,0,900,1125);
    ctx.fillStyle = '#141411';
    drawFit(images[0],55,50,185,82);
    const text = (value,x,y,size,weight = 500) => {
      ctx.font = weight + ' ' + size + 'px "PingFang TC", sans-serif';
      ctx.fillText(value,x,y);
    };
    ctx.textAlign = 'right';
    text('2027 畢業製作成果展',845,104,30);
    ctx.textAlign = 'left';
    ctx.fillRect(55,155,790,2);
    text(pair,55,228,36);
    drawFit(images[1],155,283,380,380);
    drawFit(images[2],365,440,380,380);
    text(title,55,917,78,800);
    ctx.fillRect(55,963,790,2);
    text('崑山科技大學創意媒體學院',55,1020,29);
    text('視覺傳達設計系 116 級畢業製作成果展',55,1067,29);
    canvas.hidden = false;
    if (!shared) canvas.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'scale(1)'}],
      {duration:matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 480});
    download.download = '容形－' + title + '.png';
    download.href = canvas.toDataURL('image/png');
    download.hidden = false;
    get('card-status').textContent = '';
    if (!shared && location.protocol !== 'file:') {
      const exhibit = new URL(location.pathname, location.origin).href;
      try {
        const module = await import('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm');
        if (revision !== displayedCard || !result.open) return;
        const qr = module.default(0, 'M');
        qr.addData(exhibit + '?card=' + code);
        qr.make();
        qrImage.src = qr.createDataURL(6, 24);
        qrImage.hidden = false;
        get('card-status').textContent = '用連到同一網路的手機掃碼儲存';
      } catch {
        if (revision === displayedCard) get('card-status').textContent = 'QR Code 無法載入，可直接下載 PNG。';
      }
    } else if (!shared) {
      get('card-status').textContent = '請使用展場掃碼版啟動網頁，即可顯示 QR Code。';
    }
  } catch {
    get('card-status').textContent = '作品卡載入失敗，請再試一次。';
  }
}

function update(now) {
  requestAnimationFrame(update);
  if (mode === 'intro' || result.open) return;
  if (mode === 'live') {
    try { trackHands(now); }
    catch {
      releaseCamera();
      setMode('intro', '手勢辨識已中斷，請重新開啟鏡頭。');
      return;
    }
  }
  const selection = [...new Set(mode === 'live' ? handTargets : choices)].sort((a,b) => a-b);
  targets.forEach((target,index) => target.classList.toggle('active', selection.includes(index)));
  const key = selection.length === 2 ? selection.join(',') : '';
  if (key !== held) {
    held = key;
    onset = now;
  }
  const elapsed = key ? now - onset : 0;
  progress.value = elapsed;
  const message = key ? `保持選取 · ${Math.max(0,(2 - elapsed / 1000)).toFixed(1)} 秒` :
    mode === 'demo' ? demoGuide : guide;
  if (status.textContent !== message) status.textContent = message;
  if (elapsed >= 2000) {
    cursors.forEach(cursor => cursor.hidden = true);
    showCard(selection);
  }
}

start.onclick = () => openCamera();
camera.onchange = () => openCamera(camera.value);
get('demo').onclick = () => {
  request++;
  start.disabled = false;
  releaseCamera();
  setMode('demo', demoGuide);
};
back.onclick = () => {
  request++;
  start.disabled = false;
  releaseCamera();
  setMode('intro', guide);
};
get('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    status.textContent = '請使用瀏覽器的全螢幕功能。';
  }
};
document.addEventListener('fullscreenchange', () => {
  const label = document.fullscreenElement ? '退出全螢幕' : '全螢幕';
  get('full').setAttribute('aria-label', label);
  get('full').title = label;
});
result.addEventListener('close', () => setMode(mode, mode === 'demo' ? demoGuide : guide));
window.addEventListener('pagehide', () => {
  request++;
  start.disabled = false;
  releaseCamera();
  setMode('intro', guide);
});
const cardCode = new URLSearchParams(location.search).get('card');
if (cardCode && /^[0-7]{2}$/.test(cardCode) && cardCode[0] < cardCode[1]) {
  document.body.dataset.shared = '';
  result.addEventListener('cancel', event => event.preventDefault());
  showCard([...cardCode].map(Number), true);
} else {
  requestAnimationFrame(update);
}

</script>
</body>
</html>
